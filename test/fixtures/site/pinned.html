<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture — Controls that stay put under a bar</title>
    <link rel="stylesheet" href="/site.css" />
    <style>
      /* Buttons that stay put while the page scrolls, under a bar that stays put too: no scroll brings them clear.
         One sits in a short box that hides what overflows it sideways, which a fixed button escapes. */
      .app { overflow-x: hidden; }
      .long { height: 2400px; }
      .chat, .help { position: fixed; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; }
      .chat { right: 16px; }
      .help { left: 16px; }
      .cookies { position: fixed; left: 0; right: 0; bottom: 0; height: 100px; margin: 0; padding: 12px 16px; box-sizing: border-box; background: #222; color: #fff; }
      /* Fixed inside a transformed box, the banner moves with the page, so a scroll never brings the button out
         from under it. */
      .shop { position: relative; height: 120px; transform: translateZ(0); }
      .shop button { position: absolute; left: 16px; top: 46px; height: 36px; }
      .shop p { position: fixed; left: 0; right: 0; top: 40px; height: 48px; margin: 0; padding: 12px 16px; box-sizing: border-box; background: #222; color: #fff; }
    </style>
  </head>
  <body>
    <div class="app">
      <main>
        <h1>Controls that stay put</h1>
        <div class="shop"><button type="button">Add to cart</button><p>Free shipping over fifty</p></div>
      </main>
      <button class="help" type="button">Help</button>
    </div>
    <div class="long"></div>
    <button class="chat" type="button">Chat</button>
    <p class="cookies">This site keeps a cookie.</p>
  </body>
</html>
