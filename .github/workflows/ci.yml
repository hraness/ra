name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share one group per ref, so a new push cancels the superseded run.
# main runs are grouped by commit and never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: hraness-cf
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun pm pack --dry-run --ignore-scripts
      - name: Import the built package
        run: |
          node --input-type=module -e '
            const ra = await import("./dist/index.js");
            for (const name of ["defineConfig", "openBrowser", "closeWorld", "observe", "inspectPage", "compareLooks"]) {
              if (typeof ra[name] !== "function") throw new Error("dist/index.js does not export " + name);
            }'
      - name: Verify the tree is unchanged
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

  browser:
    name: Browser (${{ matrix.os }}, playwright-core ${{ matrix.playwright }})
    runs-on: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-slim"]'), matrix.os) && 'hraness-cf' || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Playwright cannot install its browser on Ubuntu 26.04.
          - { os: ubuntu-24.04, playwright: "1.58.2" }
          - { os: ubuntu-latest, playwright: "1.62.1" }
          - { os: ubuntu-latest, playwright: "1.65.0" }
          - { os: macos-latest, playwright: "1.65.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Use playwright-core ${{ matrix.playwright }}
        env:
          WANT: ${{ matrix.playwright }}
        run: |
          set -euo pipefail
          have() { node -p 'require("./node_modules/playwright-core/package.json").version'; }
          if [[ "$(have)" != "$WANT" ]]; then
            bun add --dev --exact --ignore-scripts "playwright-core@$WANT"
          fi
          test "$(have)" = "$WANT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - run: bun run test:browser

  required:
    name: Required
    if: always()
    needs: [check, browser]
    runs-on: hraness-cf
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          CHECK: ${{ needs.check.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          for result in "$CHECK" "$BROWSER"; do
            [[ "$result" == success ]] || exit 1
          done
