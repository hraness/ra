name: Release

# A v<version> tag (made by the Tag release workflow once a version bump passes
# CI on main) is verified, tested, packed, and published as an immutable GitHub
# release whose one asset is the packed tarball. The release is the canonical
# distribution; there is no npm mirror yet.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'const v = require("./package.json").version; if (typeof v !== "string") process.exit(1); v')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bun run check
      - run: bun run test:browser
      - name: Verify the tree is unchanged
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir "$out"
          npm pack --ignore-scripts --pack-destination "$out"
          tarball="hraness-ra-${GITHUB_REF_NAME#v}.tgz"
          if [[ "$(ls "$out")" != "$tarball" ]]; then
            echo "::error::Expected exactly $tarball, found: $(ls "$out")"
            exit 1
          fi
          sha256="$(sha256sum "$out/$tarball" | cut -d' ' -f1)"
          printf 'tarball=%s\nsha256=%s\n' "$tarball" "$sha256" >> "$GITHUB_OUTPUT"
          echo "$tarball sha256:$sha256"
      - name: Install the tarball the way a project would
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          playwright="$(node -p 'require("./node_modules/playwright-core/package.json").version')"
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          cp -R test/fixtures/site "$consumer/site"
          cd "$consumer"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/pack/$TARBALL" "playwright-core@$playwright"
          test "$(npx --no-install ra --version)" = "${GITHUB_REF_NAME#v}"
          sed -i 's|"../../../src/index.ts"|"@hraness/ra"|' site/ra.config.ts
          cd site
          status=0
          npx --no-install ra check home tricky outage || status=$?
          test "$status" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      TARBALL: ${{ needs.verify.outputs.tarball }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          file="$RUNNER_TEMP/release/$TARBALL"
          if [[ "$(sha256sum "$file" | cut -d' ' -f1)" != "$SHA256" ]]; then
            echo "::error::$TARBALL does not match the tarball that was verified"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$file" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "ra $GITHUB_REF_NAME"
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length), .assets[0].name] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t1\t'"$TARBALL"
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable with its one asset: $release_state"
            exit 1
          fi
          digest="$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq '.assets[0].digest // ""')"
          if [[ -z "$digest" ]]; then
            echo "::warning::GitHub did not report a digest for $TARBALL"
          elif [[ "$digest" != "sha256:$SHA256" ]]; then
            echo "::error::GitHub reports $digest for $TARBALL, but sha256:$SHA256 was verified"
            exit 1
          fi
          echo "Published $GITHUB_REF_NAME with $TARBALL (sha256:$SHA256)"
