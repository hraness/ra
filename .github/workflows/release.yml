name: Release

# A v<version> tag (made by the Tag release workflow once a version bump passes
# CI on main) is verified, tested, packed, and published as an immutable GitHub
# release whose one asset is the packed tarball. The release is the canonical
# distribution; there is no npm mirror yet.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'const v = require("./package.json").version; if (typeof v !== "string") process.exit(1); v')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bun run check
      - uses: ./.github/actions/check-browsers
      - name: Verify the tree is unchanged
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir "$out"
          npm pack --ignore-scripts --pack-destination "$out"
          tarball="hraness-ra-${GITHUB_REF_NAME#v}.tgz"
          if [[ "$(ls "$out")" != "$tarball" ]]; then
            echo "::error::Expected exactly $tarball, found: $(ls "$out")"
            exit 1
          fi
          sha256="$(sha256sum "$out/$tarball" | cut -d' ' -f1)"
          printf 'tarball=%s\nsha256=%s\n' "$tarball" "$sha256" >> "$GITHUB_OUTPUT"
          echo "$tarball sha256:$sha256"
      - name: Install the tarball the way a project would
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          playwright="$(node -p 'require("./node_modules/playwright-core/package.json").version')"
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          cp -R test/fixtures/site "$consumer/site"
          cd "$consumer"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/pack/$TARBALL" "playwright-core@$playwright"
          test "$(npx --no-install ra --version)" = "${GITHUB_REF_NAME#v}"
          sed -i 's|"../../../src/index.ts"|"@hraness/ra"|' site/ra.config.ts
          cd site
          status=0
          npx --no-install ra check home tricky outage || status=$?
          test "$status" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      TARBALL: ${{ needs.verify.outputs.tarball }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          file="$RUNNER_TEMP/release/$TARBALL"
          if [[ "$(sha256sum "$file" | cut -d' ' -f1)" != "$SHA256" ]]; then
            echo "::error::$TARBALL does not match the tarball that was verified"
            exit 1
          fi

          # Says whether the published release is immutable and carries exactly
          # the verified tarball. GitHub records each asset's digest.
          check_published() {
            local state digest
            state="$(gh release view "$GITHUB_REF_NAME" \
              --json assets,isDraft,isImmutable,isPrerelease,tagName \
              --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length), .assets[0].name] | @tsv')"
            if [[ "$state" != "$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t1\t'"$TARBALL" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is not published and immutable with its one asset: $state"
              return 1
            fi
            digest="$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq '.assets[0].digest // ""')"
            if [[ "$digest" != "sha256:$SHA256" ]]; then
              echo "::error::GitHub reports '${digest}' for $TARBALL, but sha256:$SHA256 was verified"
              return 1
            fi
          }

          # Prints true for a draft, false for a published release, and an
          # empty line when there is none. Any other failure fails the step,
          # so an outage is never mistaken for a missing release.
          release_state() {
            local out
            if out="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/view-error")"; then
              echo "$out"
            elif grep -qx 'release not found' "$RUNNER_TEMP/view-error"; then
              echo
            else
              echo "::error::Could not read release $GITHUB_REF_NAME: $(cat "$RUNNER_TEMP/view-error")" >&2
              return 1
            fi
          }

          # Removes this tag's drafts by id. gh looks a tag up as a published
          # release and as a draft at once and takes whichever answers first,
          # so going by the tag could delete a published release of the same
          # tag. The tag was checked to be a plain version, so it is safe in jq.
          # A draft that is already gone when it is deleted counts as removed.
          remove_drafts() {
            local ids id
            ids="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")" || return 1
            for id in $ids; do
              if ! gh api --method DELETE "repos/$GH_REPO/releases/$id" >/dev/null 2>"$RUNNER_TEMP/delete-error"; then
                if ! grep -q '(HTTP 404)' "$RUNNER_TEMP/delete-error"; then
                  cat "$RUNNER_TEMP/delete-error" >&2
                  return 1
                fi
              fi
            done
          }

          # Drafts left by earlier failed runs go first, so that looking the
          # tag up finds only a published release or nothing; the tag stays.
          # A rerun after a published release only confirms it.
          for _ in 1 2 3; do
            if ! remove_drafts; then
              echo "::error::Could not remove the old drafts of $GITHUB_REF_NAME"
              exit 1
            fi
            existing="$(release_state)"
            [[ "$existing" == "true" ]] || break
          done
          if [[ "$existing" == "false" ]]; then
            check_published
            echo "$GITHUB_REF_NAME was already published with $TARBALL (sha256:$SHA256)"
            exit 0
          fi
          if [[ -n "$existing" ]]; then
            echo "::error::A draft of $GITHUB_REF_NAME is still there after removing old drafts"
            exit 1
          fi

          # Upload to a draft and prove the uploaded bytes before publishing,
          # since a published immutable release cannot be corrected. Once
          # publishing has been tried, the release is never deleted: GitHub
          # may have published it even when gh reports a failure, and an
          # immutable release's tag cannot be used again. A draft that is
          # still there is removed by the next run.
          attempted=false
          remove_draft() {
            if [[ "$attempted" == "true" ]]; then
              return 0
            fi
            if [[ "$(release_state 2>/dev/null || true)" == "true" ]]; then
              if remove_drafts; then
                echo "::error::Removed the unpublished draft of $GITHUB_REF_NAME"
              else
                echo "::error::Could not remove the unpublished draft of $GITHUB_REF_NAME; the next run removes it"
              fi
            fi
          }
          trap remove_draft EXIT
          gh release create "$GITHUB_REF_NAME" "$file" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "ra $GITHUB_REF_NAME"
          uploaded="$RUNNER_TEMP/uploaded"
          mkdir "$uploaded"
          gh release download "$GITHUB_REF_NAME" --pattern "$TARBALL" --dir "$uploaded"
          if [[ "$(ls "$uploaded")" != "$TARBALL" || "$(sha256sum "$uploaded/$TARBALL" | cut -d' ' -f1)" != "$SHA256" ]]; then
            echo "::error::The draft's asset is not the tarball that was verified"
            exit 1
          fi
          attempted=true
          if ! gh release edit "$GITHUB_REF_NAME" --draft=false --latest; then
            echo "::error::Publishing $GITHUB_REF_NAME failed or went unconfirmed. Rerun this job: it confirms a published release, or replaces a draft."
            exit 1
          fi
          check_published
          echo "Published $GITHUB_REF_NAME with $TARBALL (sha256:$SHA256)"
